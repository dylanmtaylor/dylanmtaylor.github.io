stages:
  - deploy

pages:
  image: node:24.18.1-alpine
  stage: deploy
  interruptible: true
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .cache/
  script:
    - npm ci --prefer-offline
    - npm run check
  pages:
    publish: .vitepress/dist
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
